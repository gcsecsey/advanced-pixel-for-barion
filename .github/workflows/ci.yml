name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-js:
    name: JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test

  test-php:
    name: PHP tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # The tests are plain PHP scripts that exit non-zero on failure.
      - run: |
          shopt -s nullglob
          for test in tests/*.php; do
            php "$test"
          done

  lint:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer lint
      - run: composer phpstan

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: WordPress/plugin-check-action@v1
        with:
          # Development-only directories; .distignore keeps them out of the release.
          exclude-directories: 'docs,tests,tools'

  i18n:
    name: POT freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer i18n:pot
      # -I skips the timestamp header, which changes on every regeneration.
      - run: git diff -I'^"POT-Creation-Date' --exit-code languages/advanced-pixel-for-barion.pot
