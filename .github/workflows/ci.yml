name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-js:
    name: JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test

  test-php:
    name: PHP tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # The tests are plain PHP scripts that exit non-zero on failure.
      - run: |
          shopt -s nullglob
          for test in tests/*.php; do
            php "$test"
          done

  lint:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer lint
      - run: composer phpstan

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      # Check the zip that would ship, not the repo tree, so .distignore is
      # verified on every PR and development files stay out of the results.
      - run: vendor/bin/wp dist-archive . "$RUNNER_TEMP/dist.zip"
      - run: unzip -q "$RUNNER_TEMP/dist.zip" -d "$RUNNER_TEMP/dist"
      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: ${{ runner.temp }}/dist/advanced-pixel-for-barion
          # Deliberate: the plugin ships its own translations, which wp.org
          # language packs do not cover (see the docblock at the call site).
          ignore-codes: 'PluginCheck.CodeAnalysis.DiscouragedFunctions.load_plugin_textdomainFound'

  i18n:
    name: POT freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer i18n:pot
      # -I skips the timestamp header, which changes on every regeneration.
      - run: git diff -I'^"POT-Creation-Date' --exit-code languages/advanced-pixel-for-barion.pot

  consent-browser:
    name: Consent in a real browser
    runs-on: ubuntu-latest
    # About 70s locally; the ceiling is a backstop against a hung Playground
    # boot, not a target.
    timeout-minutes: 20
    steps:
      # This is the only job that runs third-party install scripts (npm ci) and
      # fetches a browser, so it is the one where leaving the token in
      # .git/config is worth avoiding. Nothing here pushes.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium only. The harness is not browser-specific, and the other two
      # engines double the install time for nothing.
      - run: npx playwright install --with-deps chromium
      # Boots WordPress in Playground and runs both harness pages, which assert
      # that consent reaches Barion on the accept click and never at page load.
      # A unit test cannot cover that: it depends on script load order and on
      # whether a real gesture reached the page first.
      - run: npm run test:browser
