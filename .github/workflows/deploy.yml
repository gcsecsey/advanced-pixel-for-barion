name: Deploy to WordPress.org

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  # Manual only. See the assets job below for when to run it.
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: advanced-pixel-for-barion

  # Escape hatch for changes that reach users only through SVN assets, such as a
  # broken Playground blueprint or a new banner. A release is the normal route.
  #
  # IGNORE_OTHER_FILES skips the action's guard against unreleased code, so this
  # also pushes trunk/readme.txt. Only run it when readme.txt names a Stable tag
  # that already exists in SVN, otherwise the directory points at a missing tag.
  assets:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: WordPress.org asset and readme update
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: advanced-pixel-for-barion
          IGNORE_OTHER_FILES: true
